# 打 tag 就出 Release：v1.3.0 → 测试 → 两个架构的 Conclave.app → GitHub Release。
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# 也可以在 Actions 页面手动跑（填版本号），那会在当前提交上建 tag。
# 所有打包逻辑都在 scripts/ci/release-assets.sh 里，本机能原样跑通 —— 这里只是调用。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，不带 v（例如 1.3.0）
        required: true
        type: string

permissions:
  contents: write   # gh release create 要写 release 和 tag

jobs:
  release:
    # 必须是 macOS：.app 要 sips / iconutil / ditto，而且打包脚本末尾会真跑一次二进制自检。
    # macos-15 是 Apple Silicon 机器，带 Rosetta，所以 osx-x64 那个包的自检也能跑。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --generate-notes 要看得到上一个 tag

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            v="${INPUT_VERSION}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "发布 v${v}"

      # 发布前必须全绿。trx 是给架构守卫的门禁脚本读的 —— 它要确认那 7 个守卫真的跑过，
      # 而不是「0 个测试」也报绿。
      - name: 测试
        run: dotnet test Conclave.slnx --nologo -c Release --logger trx

      - name: 架构守卫真的跑过
        run: scripts/ci/assert-architecture-tests-ran.sh

      # 不导证书的话 package-macos.sh 会退回 ad-hoc 签名，而 ad-hoc 的「指定要求」
      # 就是 cdhash 本身（codesign -d -r- 可见）—— 每发一版二进制一变，macOS 就当成
      # 另一个 app，用户之前对 TCC 弹窗的选择全部作废、重新问一遍。绑到证书上才稳定。
      - name: 导入签名证书
        env:
          P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [ -z "${P12_BASE64}" ]; then
            echo "没配 CODESIGN_P12_BASE64，这次走 ad-hoc 签名"
            exit 0
          fi

          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "${P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          # 默认 5 分钟不用就上锁，打包比这久 —— 锁上之后 codesign 会失败。
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${P12_PASSWORD}" -T /usr/bin/codesign
          # 不加这句，codesign 取私钥时会弹 UI 授权，而 runner 上没人点，直接卡到超时。
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null

          # add-trusted-cert 只认证书文件，不吃 .p12，所以把公钥证书单独导出来一份。
          security find-certificate -c "${CODESIGN_IDENTITY}" -p "${KEYCHAIN}" \
            > "${RUNNER_TEMP}/cert.cer" 2>/dev/null || true
          # 加进搜索路径，否则 codesign 按名字找不到这个身份。
          security list-keychain -d user -s "${KEYCHAIN}" \
            $(security list-keychains -d user | tr -d '"')

          # 自签名根证书默认不被信任，只 import 的话 find-identity -v 会把它过滤掉，
          # codesign 跟着报找不到身份。本机建证书时就是先卡在这里：
          #   1) 73817D86… "Conclave Signing" (CSSMERR_TP_NOT_TRUSTED)
          #        1 identities found
          #        0 valid identities found
          # Developer ID 不需要这步（根在系统信任库里），但多设一次也无害。
          security add-trusted-cert -d -r trustRoot -p codeSign \
            -k "${KEYCHAIN}" "${RUNNER_TEMP}/cert.cer" 2>/dev/null \
            || echo "add-trusted-cert 没成功，若下一步找不到有效身份即为此因"

          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/cert.cer"

          echo "可用身份："
          # 这里必须是 -v：没有 -v 的话不受信任的证书也会列出来，看着像成功了，
          # 而 codesign 实际用不了它。
          security find-identity -v -p codesigning "${KEYCHAIN}"

      - name: 打包两个架构
        env:
          # 没配就是空串，package-macos.sh 的 [ -n ... ] 会退回 ad-hoc —— 所以
          # 这套改动在 secret 填好之前不会让流水线挂。
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: scripts/ci/release-assets.sh "${{ steps.ver.outputs.version }}"

      # 私钥不能留在 runner 上过夜。always() 是为了打包失败时也清。
      - name: 清掉临时钥匙串
        if: always()
        run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          # 资产列表刻意不写死后缀：release-assets.sh 出什么就发什么（zip + tar.gz +
          # SHA256SUMS + manifest.json），只把 NOTES.md 排除 —— 它是 release 正文，
          # 不是下载物。第一版写死了 release/*.zip，于是 tar.gz 生成了却没上传，
          # 而 NOTES 正指着那个不存在的文件让人 tar -xzf。
          #
          # 不能用 mapfile：runner 上的 /bin/bash 是 3.2（Apple 从 2019 年起就停在这一版，
          # 因为 4.0 换成了 GPLv3），而 mapfile 是 bash 4.0 才有的内建命令。
          # v1.0.3 就是挂在那一行上：mapfile: command not found，exit 127。
          # while read 是 3.2 也有的写法；IFS= 与 -r 保证带空格或反斜杠的文件名不被拆开，
          # 而 < <(...) 的进程替换让循环跑在当前 shell 里（管道会把它丢进子 shell，
          # 数组就带不出来了）。
          ASSETS=()
          while IFS= read -r asset; do
            ASSETS+=("$asset")
          done < <(find release -type f ! -name NOTES.md | sort)

          # 一个资产都没有时要当场失败。gh release create 不带文件照样会成功，
          # 建出一个只有正文没有下载物的 release —— 而那正是「NOTES 指着一个
          # 不存在的文件」那类故障最难被发现的形态。
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "release/ 下一个可发布的资产都没有 —— release-assets.sh 没出东西？" >&2
            exit 1
          fi

          printf '发布资产：%s\n' "${ASSETS[*]}"

          # 重跑同一个 tag 时 create 会失败，那就改成往已有的 release 上传（覆盖同名文件）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Conclave $TAG" \
              --notes-file release/NOTES.md \
              --generate-notes
          fi

      # 包也留在 workflow 的产物里，Release 被删了还能找回来。
      - uses: actions/upload-artifact@v4
        with:
          name: conclave-${{ steps.ver.outputs.version }}
          path: release/
          if-no-files-found: error
