# 打 tag 就出 Release：v1.3.0 → 测试 → 两个架构的 Conclave.app → GitHub Release。
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# 也可以在 Actions 页面手动跑（填版本号），那会在当前提交上建 tag。
# 所有打包逻辑都在 scripts/ci/release-assets.sh 里，本机能原样跑通 —— 这里只是调用。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，不带 v（例如 1.3.0）
        required: true
        type: string

permissions:
  contents: write   # gh release create 要写 release 和 tag

jobs:
  release:
    # 必须是 macOS：.app 要 sips / iconutil / ditto，而且打包脚本末尾会真跑一次二进制自检。
    # macos-15 是 Apple Silicon 机器，带 Rosetta，所以 osx-x64 那个包的自检也能跑。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --generate-notes 要看得到上一个 tag

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            v="${INPUT_VERSION}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "发布 v${v}"

      # 发布前必须全绿。trx 是给架构守卫的门禁脚本读的 —— 它要确认那 7 个守卫真的跑过，
      # 而不是「0 个测试」也报绿。
      - name: 测试
        run: dotnet test Conclave.slnx --nologo -c Release --logger trx

      - name: 架构守卫真的跑过
        run: scripts/ci/assert-architecture-tests-ran.sh

      - name: 打包两个架构
        run: scripts/ci/release-assets.sh "${{ steps.ver.outputs.version }}"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          # 资产列表刻意不写死后缀：release-assets.sh 出什么就发什么（zip + tar.gz +
          # SHA256SUMS + manifest.json），只把 NOTES.md 排除 —— 它是 release 正文，
          # 不是下载物。第一版写死了 release/*.zip，于是 tar.gz 生成了却没上传，
          # 而 NOTES 正指着那个不存在的文件让人 tar -xzf。
          #
          # 不能用 mapfile：runner 上的 /bin/bash 是 3.2（Apple 从 2019 年起就停在这一版，
          # 因为 4.0 换成了 GPLv3），而 mapfile 是 bash 4.0 才有的内建命令。
          # v1.0.3 就是挂在那一行上：mapfile: command not found，exit 127。
          # while read 是 3.2 也有的写法；IFS= 与 -r 保证带空格或反斜杠的文件名不被拆开，
          # 而 < <(...) 的进程替换让循环跑在当前 shell 里（管道会把它丢进子 shell，
          # 数组就带不出来了）。
          ASSETS=()
          while IFS= read -r asset; do
            ASSETS+=("$asset")
          done < <(find release -type f ! -name NOTES.md | sort)

          # 一个资产都没有时要当场失败。gh release create 不带文件照样会成功，
          # 建出一个只有正文没有下载物的 release —— 而那正是「NOTES 指着一个
          # 不存在的文件」那类故障最难被发现的形态。
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "release/ 下一个可发布的资产都没有 —— release-assets.sh 没出东西？" >&2
            exit 1
          fi

          printf '发布资产：%s\n' "${ASSETS[*]}"

          # 重跑同一个 tag 时 create 会失败，那就改成往已有的 release 上传（覆盖同名文件）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Conclave $TAG" \
              --notes-file release/NOTES.md \
              --generate-notes
          fi

      # 包也留在 workflow 的产物里，Release 被删了还能找回来。
      - uses: actions/upload-artifact@v4
        with:
          name: conclave-${{ steps.ver.outputs.version }}
          path: release/
          if-no-files-found: error
