  -->
  <path fill="#000" fill-rule="evenodd"
        d="M4 2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z
           M5.6 5.6h11v3.4H9v4h7.6v3.4h-11Z"/>
</svg>
